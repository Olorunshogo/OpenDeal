[workspace]
resolver = "2"
members = [
    "crates/opendeal-core",
    "crates/opendeal-bitcoin",
    "crates/opendeal-api",
    "examples/regtest-demo",
]
default-members = ["crates/opendeal-api"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
opendeal-core = { path = "crates/opendeal-core" }
opendeal-bitcoin = { path = "crates/opendeal-bitcoin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
secp256k1 = { version = "0.29", features = ["global-context", "rand-std", "serde"] }
bitcoin = { version = "0.32", features = ["serde", "std", "rand"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
async-trait = "0.1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
