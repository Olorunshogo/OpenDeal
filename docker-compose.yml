services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_USER: opendeal
      POSTGRES_PASSWORD: opendeal
      POSTGRES_DB: opendeal

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U opendeal -d opendeal
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
