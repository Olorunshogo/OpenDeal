[package]
name = "opendeal-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Terminal UI for preparing OpenDeal demo data: public keys, escrow preview, and deal terms. Never holds private keys."

[[bin]]
name = "opendeal-tui"
path = "src/main.rs"

[dependencies]
opendeal-core = { workspace = true }
opendeal-bitcoin = { workspace = true }
bitcoin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
# ratatui re-exports the matching crossterm version as `ratatui::crossterm`.
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
arboard = { version = "3", default-features = false }
